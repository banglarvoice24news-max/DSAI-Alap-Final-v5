name: nexus_comm
description: Hybrid E2EE communication app with internet, mesh, and SIM calling.
publish_to: "none"
version: 5.0.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dio: ^5.8.0
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9+2
  nearby_connections: ^4.1.1
  flutter_sound: ^9.16.3
  opus_dart: ^3.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  cryptography: ^2.7.0
  collection: ^1.18.0
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite_sqlcipher: 3.1.0
  wakelock_plus: ^1.2.10
  battery_plus: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
