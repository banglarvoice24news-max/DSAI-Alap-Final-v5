name: Build APK & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to create/update"
        required: false
        default: "apk-latest"
      api_base_url:
        description: "API base URL compiled into the app"
        required: false
        default: "https://dsaialap.banglarvoice24news.com"

permissions:
  contents: write

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test --concurrency=1

  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Release Signing
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL="${{ inputs.api_base_url || 'https://dsaialap.banglarvoice24news.com' }}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsaialap-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'apk-latest' }}
          name: dsaialap APK ${{ inputs.release_tag || 'apk-latest' }}
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/*-release.apk
          fail_on_unmatched_files: true
