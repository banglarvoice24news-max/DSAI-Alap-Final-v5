<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsaialap B2B Portal</title>
    <style>
      :root { color-scheme: dark; }
      body { margin:0; font-family: ui-sans-serif, system-ui; background:#05070c; color:#e8fbff; }
      .wrap { max-width:720px; margin:8vh auto; padding:24px; }
      .card { background:rgba(20,28,40,.55); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:24px; backdrop-filter: blur(16px); }
      input, button { font: inherit; padding:10px 12px; border-radius:10px; border:1px solid #2b3b4d; }
      input { width:100%; background:#0b121a; color:#fff; }
      button { background:#00f0ff; color:#041018; font-weight:700; cursor:pointer; }
      pre { white-space:pre-wrap; word-break:break-all; }
      a { color:#7cff6b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>dsaialap SaaS</h1>
        <p>Enterprise B2B health. Header: <code>x-dsaialap-key</code></p>
        <label>API base</label>
        <input id="base" value="https://dsaialap.banglarvoice24news.com" />
        <br /><br />
        <label>API key</label>
        <input id="key" placeholder="tenant key" />
        <br /><br />
        <button id="go">Check /api/b2b/v1/me</button>
        <pre id="out"></pre>
      </div>
    </div>
    <script>
      document.getElementById("go").onclick = async () => {
        const base = document.getElementById("base").value.replace(/\/$/, "");
        const key = document.getElementById("key").value;
        const out = document.getElementById("out");
        try {
          const res = await fetch(base + "/api/b2b/v1/me", { headers: { "x-dsaialap-key": key } });
          out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (err) {
          out.textContent = String(err);
        }
      };
    </script>
  </body>
</html>
